# Ephemeral services for CI integration tests. Started and destroyed by the Jenkinsfile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: app_test
       ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d app_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
        ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
